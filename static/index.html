<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Multimodal Chat - Test Page</title>
<style>
  body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
  #log { border: 1px solid #ccc; border-radius: 8px; padding: 12px; min-height: 200px; margin-bottom: 12px; white-space: pre-wrap; }
  .row { display: flex; gap: 8px; margin-bottom: 8px; }
  input[type=text] { flex: 1; padding: 8px; }
  button { padding: 8px 16px; }
  img.preview { max-width: 120px; display: block; margin-bottom: 8px; border-radius: 6px; }
</style>
</head>
<body>
  <h2>Multimodal Chat (test page)</h2>
  <img id="preview" class="preview" style="display:none" />
  <div id="log"></div>
  <div class="row">
    <input type="file" id="imageInput" accept="image/*" />
  </div>
  <div class="row">
    <input type="text" id="messageInput" placeholder="Type a message..." />
    <button id="sendBtn">Send</button>
  </div>

<script>
  const log = document.getElementById('log');
  const preview = document.getElementById('preview');
  const imageInput = document.getElementById('imageInput');
  const messageInput = document.getElementById('messageInput');
  const sendBtn = document.getElementById('sendBtn');

  imageInput.addEventListener('change', () => {
    const file = imageInput.files[0];
    if (file) {
      preview.src = URL.createObjectURL(file);
      preview.style.display = 'block';
    }
  });

  sendBtn.addEventListener('click', async () => {
    const message = messageInput.value.trim();
    if (!message) return;

    log.textContent += `\nYou: ${message}`;
    const formData = new FormData();
    formData.append('message', message);
    if (imageInput.files[0]) {
      formData.append('image', imageInput.files[0]);
    }

    sendBtn.disabled = true;
    log.textContent += `\nBot: (thinking...)`;

    try {
      const res = await fetch('/chat', { method: 'POST', body: formData });
      const data = await res.json();
      log.textContent = log.textContent.replace('Bot: (thinking...)',
        `Bot: ${data.response || ('Error: ' + data.error)}`);
    } catch (e) {
      log.textContent = log.textContent.replace('Bot: (thinking...)', `Bot: Error: ${e}`);
    }

    sendBtn.disabled = false;
    messageInput.value = '';
    imageInput.value = '';
    preview.style.display = 'none';
    log.scrollTop = log.scrollHeight;
  });
</script>
</body>
</html>
